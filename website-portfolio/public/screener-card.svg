      <stop stop-color="#03070d"/>
      <stop offset="0.55" stop-color="#050812"/>
      <stop offset="1" stop-color="#080611"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
